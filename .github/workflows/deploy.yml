name: Auto Deploy CarLog to charafeddine.xyz/karkare

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  web-deploy:
    name: Sync CarLog Backend & Web View to public_html/karkare
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: FTP Deploy Action
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: backend/
          server-dir: public_html/karkare/
          exclude: |
            **/.git*
            **/.git*/**
            **/README.md
            **/.cpanel.yml
            uploads/**
