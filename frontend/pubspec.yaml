name: carlog
description: "CarLog - Production Offline-First Vehicle & Motorcycle Maintenance Platform"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  drift: ^2.18.0
  drift_flutter: ^0.1.4
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.3
  path: ^1.9.0
  dio: ^5.4.3+1
  connectivity_plus: ^6.0.3
  internet_connection_checker_plus: ^2.5.1
  google_mlkit_text_recognition: ^0.13.0
  image_picker: ^1.1.2
  record: ^5.1.2
  audioplayers: ^6.0.0
  pdf: ^3.10.8
  printing: ^5.13.1
  qr_flutter: ^4.1.0
  uuid: ^4.4.0
  intl: ^0.19.0
  flutter_secure_storage: ^9.2.2
  google_sign_in: ^6.2.1
  fl_chart: ^0.68.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  drift_dev: ^2.18.0
  build_runner: ^2.4.9
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/wmi_manufacturers.json
    - assets/obd_codes.json
